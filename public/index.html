<!doctype html>
<!-- 旅行路线 · 经费台 — 多用户版前端（hash 路由 SPA，由后端内置托管） -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅行路线 · 经费台</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
  <div class="h-row">
    <div>
      <div class="h-title" id="homeLink">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>
        <span id="headerSiteName">旅行路线 · 经费台</span>
      </div>
      <div class="h-sub">管理历年出行路线与花费 · 多用户</div>
    </div>
    <div class="h-actions">
      <div id="guestArea">
        <button class="btn btn-ghost btn-sm" onclick="location.hash='#/login'">登录</button>
        <button class="btn btn-primary btn-sm" onclick="location.hash='#/register'">注册</button>
      </div>
      <div id="userArea" class="menu hidden">
        <div class="user-chip" id="userMenuBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span id="userName">…</span>
          <svg class="user-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="menu-panel" id="userMenu">
          <div class="menu-head" id="menuHead"><span class="menu-head-name" id="menuHeadName">…</span><span class="menu-head-role" id="menuHeadRole">用户</span></div>
          <button class="menu-item" id="profileLink">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
            <span>个人中心</span>
          </button>
          <button class="menu-item" id="adminLink" style="display:none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
            <span>管理后台</span>
          </button>
          <div class="menu-sep"></div>
          <button class="menu-item menu-item-danger" id="logoutBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            <span>退出登录</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>

<main id="view" style="min-height:calc(100vh - 130px)">
  <div class="wrap"><div class="empty">加载中…</div></div>
</main>

<div class="foot">多用户数据互相隔离，安全可靠。<br>© Kyson 原创技术支持</div>

<!-- 路线新增/编辑表单 -->
<div class="mask" id="formMask">
  <div class="sheet">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span id="formTitle">新增路线</span><button class="close-x" data-close="formMask">×</button></h2>
    <div class="field"><label>路线名称 <span class="hint">如：西北大环线 / 京都赏枫</span></label><input id="f_name" placeholder="路线名称"></div>
    <div class="exp-grid">
      <div class="field"><label>年份</label><input id="f_year" placeholder="2026" inputmode="numeric"></div>
      <div class="field"><label>出行日期</label><input id="f_daterange" placeholder="6/17 - 6/24"></div>
      <div class="field"><label>类型</label>
        <select id="f_type"><option value="自由行">自由行</option><option value="跟团">跟团</option><option value="半自由行">半自由行</option></select>
      </div>
      <div class="field"><label>天数</label><input id="f_days" placeholder="8" inputmode="numeric"></div>
      <div class="field"><label>同行人数 <span class="hint">用于算人均</span></label><input id="f_people" placeholder="2" inputmode="numeric"></div>
      <div class="field"><label>币种</label><select id="f_currency"></select></div>
      <div class="field"><label>总预算 <span class="hint">本位币近似</span></label><input id="f_budget_total" placeholder="0" inputmode="decimal"></div>
      <div class="field"><label>日均预算</label><input id="f_budget_daily" placeholder="0" inputmode="decimal"></div>
      <div class="field"><label>主要目的地</label><input id="f_dest" placeholder="青海、甘肃"></div>
    </div>
    <div class="field"><label>景点路线</label><textarea id="f_scenic" placeholder="按天记录：Day1 西宁-祁连…；Day2 张掖…"></textarea></div>
    <div class="field"><label>住宿位置</label><textarea id="f_hotel" placeholder="如家武林广场店、迪堡酒店…"></textarea></div>
    <div class="field">
      <label>9 类花费（元）<span class="hint">只填知道的，留空计 0</span></label>
      <div class="exp-grid" id="expInputs"></div>
    </div>
    <div class="field"><label>备注</label><textarea id="f_notes" placeholder="可选"></textarea></div>
    <div class="sheet-actions">
      <button class="btn btn-danger btn-sm" id="formDelete" style="display:none">删除</button>
      <button class="btn" data-close="formMask">取消</button>
      <button class="btn btn-primary" id="formSave">保存路线</button>
    </div>
  </div>
</div>

<!-- 路线详情 -->
<div class="mask" id="detailMask">
  <div class="sheet">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span id="d_name"></span><button class="close-x" data-close="detailMask">×</button></h2>
    <div id="d_body"></div>
    <div class="sheet-actions">
      <button class="btn" id="d_edit">编辑</button>
      <button class="btn btn-primary" data-close="detailMask">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="/assets/main.js"></script>
</body>
</html>
