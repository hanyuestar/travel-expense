<!doctype html>
<!-- 旅行路线 · 经费台 — 多用户版前端（hash 路由 SPA，由后端内置托管） -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅行路线 · 经费台</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
  <div class="h-row">
    <div>
      <div class="h-title" id="homeLink">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>
        <span id="headerSiteName">旅行路线 · 经费台</span>
      </div>
      <div class="h-sub">管理历年出行路线与花费 · 多用户</div>
    </div>
      <div class="h-actions">
      <div id="userArea" class="menu hidden">
        <div class="user-chip" id="userMenuBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span id="userName">…</span>
          <svg class="user-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="menu-panel" id="userMenu">
          <div class="menu-head" id="menuHead"><span class="menu-head-name" id="menuHeadName">…</span><span class="menu-head-role" id="menuHeadRole">用户</span></div>
          <button class="menu-item" id="profileLink">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
            <span>个人中心</span>
          </button>
          <button class="menu-item" id="adminLink" style="display:none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
            <span>管理后台</span>
          </button>
          <div class="menu-sep"></div>
          <button class="menu-item" id="switchServerBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/><path d="M7 7h.01M7 17h.01"/></svg>
            <span>切换服务器</span>
          </button>
          <button class="menu-item menu-item-danger" id="logoutBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            <span>退出登录</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>

<main id="view" style="min-height:calc(100vh - 130px)">
  <div class="wrap"><div class="empty">加载中…</div></div>
</main>

<div class="foot">多用户数据互相隔离，安全可靠。<br>© Kyson 原创技术支持</div>

<!-- 路线新增/编辑表单 -->
<div class="mask" id="formMask">
  <div class="sheet">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span id="formTitle">新增路线</span><button class="close-x" data-close="formMask">×</button></h2>
    <div class="field"><label>路线名称 <span class="hint">如：西北大环线 / 京都赏枫</span></label><input id="f_name" placeholder="路线名称"></div>
    <div class="exp-grid">
      <div class="field"><label>年份</label><input id="f_year" placeholder="2026" inputmode="numeric"></div>
      <div class="field"><label>开始日期</label><input type="date" id="f_start_date"></div>
      <div class="field"><label>结束日期</label><input type="date" id="f_end_date"></div>
      <div class="field"><label>类型</label>
        <select id="f_type"><option value="自由行">自由行</option><option value="跟团">跟团</option><option value="半自由行">半自由行</option></select>
      </div>
      <div class="field"><label>天数 <span class="hint">自动计算</span></label><input id="f_days" placeholder="自动" readonly style="background:#f5f7f6;cursor:not-allowed"></div>
      <div class="field"><label>同行人数 <span class="hint">用于算人均</span></label><input id="f_people" placeholder="2" inputmode="numeric"></div>
      <div class="field"><label>币种</label><select id="f_currency"></select></div>
      <div class="field"><label>总预算 <span class="hint">本位币近似</span></label><input id="f_budget_total" placeholder="0" inputmode="decimal"></div>
      <div class="field"><label>日均预算</label><input id="f_budget_daily" placeholder="0" inputmode="decimal"></div>
      <div class="field"><label>主要目的地</label><input id="f_dest" placeholder="青海、甘肃"></div>
    </div>
    <input type="hidden" id="f_daterange" value="">
    <div class="field">
      <label style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span>景点路线</span>
        <button type="button" class="btn btn-sm btn-line" id="aiPlanBtn" title="AI 智能规划行程" style="padding:2px 8px;font-size:12px;display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:middle"><path d="M12 2a4 4 0 0 1 4 4v1h1a3 3 0 0 1 3 3v1a3 3 0 0 1-3 3h-1v1a4 4 0 0 1-8 0v-1H7a3 3 0 0 1-3-3v-1a3 3 0 0 1 3-3h1V6a4 4 0 0 1 4-4z"/><circle cx="9" cy="11" r="1"/><circle cx="15" cy="11" r="1"/></svg>
          <span style="vertical-align:middle">AI 规划</span>
        </button>
        <button type="button" class="btn btn-sm btn-line" id="aiChatBtn" title="AI 对话式调整行程" style="padding:2px 8px;font-size:12px;display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:middle"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span style="vertical-align:middle">调整</span>
        </button>
      </label>
      <textarea id="f_scenic" placeholder="按天记录：Day1 西宁-祁连…；Day2 张掖…"></textarea>
    </div>
    <div class="field"><label>住宿位置</label><textarea id="f_hotel" placeholder="如家武林广场店、迪堡酒店…"></textarea></div>
    <div class="field">
      <label>9 类花费（元）<span class="hint">只填知道的，留空计 0</span></label>
      <div class="exp-grid" id="expInputs"></div>
    </div>
    <div class="field"><label>备注</label><textarea id="f_notes" placeholder="可选"></textarea></div>
    <div class="sheet-actions">
      <button class="btn btn-danger btn-sm" id="formDelete" style="display:none">删除</button>
      <button class="btn" data-close="formMask">取消</button>
      <button class="btn btn-primary" id="formSave">保存路线</button>
    </div>
  </div>
</div>

<!-- 路线详情 -->
<div class="mask" id="detailMask">
  <div class="sheet">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span id="d_name"></span><button class="close-x" data-close="detailMask">×</button></h2>
    <div id="d_body"></div>
    <div class="sheet-actions">
      <button class="btn" id="d_edit">编辑</button>
      <button class="btn btn-primary" data-close="detailMask">关闭</button>
    </div>
  </div>
</div>

<!-- AI 行程对话调整面板 -->
<div class="mask" id="aiChatMask">
  <div class="sheet" style="max-width:680px">
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;vertical-align:middle"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span style="vertical-align:middle">AI 行程调整</span>
      <button class="close-x" data-close="aiChatMask">×</button>
    </h2>
    <div style="margin-bottom:10px">
      <div style="font-size:13px;color:#666;margin-bottom:6px;cursor:pointer;display:flex;align-items:center;gap:4px" id="aiChatCurrentToggle">
        <span>📋 当前行程（点击展开/收起）</span>
      </div>
      <div id="aiChatCurrentContent" style="background:#f7f7f7;border-radius:6px;padding:10px;font-size:13px;line-height:1.6;max-height:120px;overflow-y:auto;white-space:pre-wrap;display:none"></div>
    </div>
    <div id="aiChatMessages" style="flex:1;overflow-y:auto;min-height:200px;max-height:400px;border:1px solid #eee;border-radius:8px;padding:12px;margin-bottom:12px;background:#fafafa">
      <div style="text-align:center;color:#999;font-size:13px;padding:20px 0">
        输入调整要求，AI 会基于当前行程进行修改<br>
        <span style="font-size:12px">例如：把第二天的故宫换成颐和园、增加美食推荐、第一天太赶了精简一下</span>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:flex-end">
      <textarea id="aiChatInput" placeholder="输入调整要求，如：把第二天的故宫换成颐和园" rows="2" style="flex:1;resize:none;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:14px;font-family:inherit"></textarea>
      <button class="btn btn-primary" id="aiChatSend" style="white-space:nowrap;height:42px">发送</button>
    </div>
    <div id="aiChatApplyBar" style="display:none;margin-top:10px;padding:10px;background:#e8f5e9;border-radius:6px;align-items:center;justify-content:space-between">
      <span style="font-size:13px;color:#2e7d32">✨ AI 已生成调整后的行程</span>
      <button class="btn btn-primary btn-sm" id="aiChatApply">应用此版本</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="/assets/main.js"></script>
</body>
</html>
