<!doctype html>
<!-- 旅行路线 · 经费台 — 纯前端演示版（无后端，数据仅临时存于浏览器 localStorage） -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅行路线 · 经费台（在线演示）</title>
<style>
  :root{
    --primary:#15a98c; --primary-d:#0e8a72; --primary-l:#e6f7f2;
    --accent:#38bdf8; --bg:#f3fbf9; --card:#ffffff; --line:#e3efeb;
    --text:#1f2d2b; --muted:#6b7d79; --danger:#e2553b; --warn:#e8a33d;
    --shadow:0 4px 18px rgba(20,90,75,.08);
    --c0:#60a5fa; --c1:#3b82f6; --c2:#06b6d4; --c3:#f59e0b; --c4:#ef6b5e;
    --c5:#a78bfa; --c6:#ec4899; --c7:#fb923c; --c8:#94a3b8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  .demobar{background:linear-gradient(120deg,#fff7e6,#fdeccb);color:#8a5a00;border-bottom:1px solid #f3d99a;
    font-size:13px;padding:9px 14px;text-align:center;line-height:1.5}
  .demobar b{color:#b9790a}
  header{position:sticky;top:0;z-index:30;background:linear-gradient(120deg,var(--primary),#1cc3a3);
    color:#fff;padding:14px 16px 12px;box-shadow:0 2px 12px rgba(20,90,75,.18)}
  .h-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .h-title{font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px}
  .h-title svg{width:24px;height:24px}
  .h-sub{font-size:12px;opacity:.85;margin-top:2px}
  .h-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sync{display:flex;align-items:center;gap:5px;font-size:12px;background:rgba(255,255,255,.18);
    padding:5px 9px;border-radius:20px}
  .sync .dot{width:8px;height:8px;border-radius:50%;background:#bff7e6;box-shadow:0 0 0 0 rgba(191,247,230,.7);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(191,247,230,.6)}70%{box-shadow:0 0 0 7px rgba(191,247,230,0)}100%{box-shadow:0 0 0 0 rgba(191,247,230,0)}}
  .btn{border:none;border-radius:12px;padding:0 14px;min-height:42px;font-size:14px;font-weight:600;
    cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s;background:var(--card);color:var(--text)}
  .btn svg{width:18px;height:18px}
  .btn:hover{transform:translateY(-1px)}
  .btn-primary{background:#fff;color:var(--primary-d)}
  .btn-ghost{background:rgba(255,255,255,.18);color:#fff}
  .btn-sm{min-height:36px;padding:0 11px;font-size:13px;border-radius:10px}
  .btn-danger{background:#fde8e3;color:var(--danger)}
  .btn-block{width:100%;justify-content:center}
  .menu{position:relative}
  .menu-panel{position:absolute;right:0;top:48px;background:#fff;color:var(--text);border-radius:14px;
    box-shadow:var(--shadow);padding:8px;min-width:180px;display:none;z-index:40}
  .menu-panel.open{display:block}
  .menu-panel button{width:100%;justify-content:flex-start;background:#fff;color:var(--text);margin:2px 0}
  .menu-panel button:hover{background:var(--primary-l)}

  /* upcoming banner */
  .upcoming{margin:14px 14px 0;background:linear-gradient(135deg,#fff,#eafaf5);border:1px solid var(--line);
    border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
  .upcoming h3{margin:0 0 8px;font-size:14px;color:var(--primary-d);display:flex;align-items:center;gap:6px}
  .upcoming h3 svg{width:17px;height:17px}
  .up-list{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
  .up-card{flex:0 0 auto;min-width:200px;background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;cursor:pointer;transition:.15s}
  .up-card:hover{border-color:var(--primary);transform:translateY(-2px)}
  .up-name{font-weight:700;font-size:14px}
  .up-meta{font-size:12px;color:var(--muted);margin-top:3px}
  .up-tag{display:inline-block;background:var(--primary-l);color:var(--primary-d);font-size:11px;
    padding:2px 8px;border-radius:10px;margin-top:6px;font-weight:600}

  /* nav */
  nav{display:flex;gap:8px;padding:14px 14px 4px;max-width:1080px;margin:0 auto}
  .tab{flex:1;text-align:center;padding:11px;border-radius:12px;background:#fff;border:1px solid var(--line);
    font-weight:600;color:var(--muted);cursor:pointer;transition:.15s;min-height:46px;display:flex;
    align-items:center;justify-content:center;gap:6px}
  .tab svg{width:18px;height:18px}
  .tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}

  .wrap{max-width:1080px;margin:0 auto;padding:6px 14px 20px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 14px}
  .toolbar .grow{flex:1;min-width:140px}
  input,select,textarea{font-family:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);
    border-radius:10px;background:#fff;color:var(--text);width:100%}
  textarea{resize:vertical;min-height:70px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-l)}
  .chip-row{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:8px 13px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--muted);
    font-size:13px;cursor:pointer;min-height:40px}
  .chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:9px;transition:.15s}
  .card:hover{transform:translateY(-2px)}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .card-name{font-size:16px;font-weight:700;line-height:1.3}
  .badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
  .badge{font-size:11px;padding:2px 8px;border-radius:9px;font-weight:600}
  .b-year{background:var(--primary-l);color:var(--primary-d)}
  .b-type{background:#eef2ff;color:#5b6ef5}
  .b-days{background:#fef3e2;color:#c9791a}
  .card-meta{font-size:13px;color:var(--muted)}
  .card-total{display:flex;align-items:baseline;gap:8px}
  .card-total .amt{font-size:22px;font-weight:800;color:var(--primary-d)}
  .card-total .per{font-size:12px;color:var(--muted)}
  .minibar{height:9px;border-radius:6px;overflow:hidden;display:flex;background:#eef3f1}
  .minibar span{height:100%}
  .card-actions{display:flex;gap:8px;margin-top:2px}
  .card-actions .btn{flex:1;justify-content:center}

  /* stats */
  .stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
  .stat .v{font-size:24px;font-weight:800;color:var(--primary-d)}
  .stat .l{font-size:12px;color:var(--muted);margin-top:3px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
  .panel h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:7px}
  .panel h3 svg{width:18px;height:18px;color:var(--primary)}
  .legend{display:flex;flex-direction:column;gap:7px;margin-top:10px}
  .legend-item{display:flex;align-items:center;gap:8px;font-size:13px}
  .legend-item .sw{width:12px;height:12px;border-radius:3px;flex:0 0 auto}
  .legend-item .lv{margin-left:auto;font-weight:700;color:var(--text)}
  .legend-item .lp{color:var(--muted);width:42px;text-align:right}
  .chart{width:100%;max-width:240px;display:block;margin:0 auto}
  .donut-total{font-size:17px;font-weight:800;fill:var(--text)}
  .donut-sub{font-size:11px;fill:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:24px;font-size:13px}
  .flex2{display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:640px){.flex2{grid-template-columns:1fr 1fr}}

  /* modal */
  .mask{position:fixed;inset:0;background:rgba(15,40,33,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .mask.open{display:flex}
  .sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;
    padding:18px 18px calc(20px + env(safe-area-inset-bottom));animation:slide .2s ease}
  @media(min-width:560px){.mask{align-items:center}.sheet{border-radius:20px}}
  @keyframes slide{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .sheet h2{margin:0 0 14px;font-size:18px;display:flex;align-items:center;gap:8px}
  .sheet h2 svg{width:20px;height:20px;color:var(--primary)}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .field .hint{font-size:11px;color:var(--muted);font-weight:400}
  .exp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(min-width:480px){.exp-grid{grid-template-columns:1fr 1fr 1fr}}
  .exp-cell{border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:#fafdfc}
  .exp-cell .el{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:5px}
  .exp-cell .el .sw{width:10px;height:10px;border-radius:3px}
  .exp-cell input{font-size:15px;padding:7px 9px;border-radius:8px}
  .detail-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .detail-row:last-child{border-bottom:none}
  .detail-row .k{color:var(--muted)}
  .detail-row .v{font-weight:600;text-align:right;max-width:62%}
  .pre-wrap{white-space:pre-wrap;word-break:break-word;background:#f7fbfa;border-radius:10px;padding:10px;font-size:13px;line-height:1.6}
  .sheet-actions{display:flex;gap:10px;margin-top:8px}
  .sheet-actions .btn{flex:1;justify-content:center}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#1f2d2b;color:#fff;
    padding:11px 18px;border-radius:24px;font-size:14px;z-index:80;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  .close-x{margin-left:auto;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:18px;padding:0 14px}
  .foot a{color:var(--primary-d)}

  @media(max-width:560px){
    header{padding:11px 12px 10px}
    .h-title{font-size:17px}
    .h-sub{font-size:11px}
    .h-actions{width:100%;margin-left:0;margin-top:8px;justify-content:flex-end}
    .h-actions .btn{padding:0 11px;min-height:38px}
    .wrap{padding:6px 10px 16px}
    .upcoming{margin:12px 10px 0;padding:11px 12px}
    nav{padding:12px 10px 4px}
    .grid{grid-template-columns:1fr;gap:12px}
    .stat-cards{grid-template-columns:1fr 1fr}
    .panel{padding:13px}
    .exp-grid{grid-template-columns:1fr 1fr}
  }
  @media(max-width:380px){
    .stat-cards{grid-template-columns:1fr}
    .h-title{font-size:16px}
  }
</style>
</head>
<body>
<div class="demobar">🧪 这是<b>演示版</b>：所有数据仅临时保存在<b>你的浏览器本地</b>（localStorage），不会上传任何服务器。可随意新增 / 编辑 / 删除路线、查看年度统计来体验功能。</div>
<header>
  <div class="h-row">
    <div>
      <div class="h-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>
        旅行路线 · 经费台
      </div>
      <div class="h-sub">演示版 · 纯前端 · 数据存于你的浏览器</div>
    </div>
    <div class="h-actions">
      <div class="sync"><span class="dot"></span><span id="syncTxt">加载中…</span></div>
      <button class="btn btn-ghost btn-sm" id="backupBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>备份
      </button>
      <div class="menu-panel" id="backupMenu">
        <button id="expBtn">⬇ 导出 JSON 备份</button>
        <button id="impBtn">⬆ 导入数据</button>
        <button id="clrAllBtn" style="color:var(--danger)">⚠ 清空全部数据</button>
        <input type="file" id="fileInput" accept=".json" style="display:none">
      </div>
      <button class="btn btn-primary" id="addBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>新增路线
      </button>
    </div>
  </div>
</header>

<section class="upcoming" id="upcomingBox" style="display:none">
  <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>即将出行</h3>
  <div class="up-list" id="upList"></div>
</section>

<nav>
  <div class="tab active" data-view="routes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-5-2V4l5 2 6-2 5 2v14l-5-2-6 2z"/><path d="M9 4v16M15 2v16"/></svg>路线管理
  </div>
  <div class="tab" data-view="stats">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>年度复盘
  </div>
</nav>

<div class="wrap">
  <div id="view-routes">
    <div class="toolbar">
      <div class="grow"><input id="search" placeholder="搜索目的地 / 路线名…"></div>
    </div>
    <div class="chip-row" id="yearChips"></div>
    <div class="grid" id="routeGrid" style="margin-top:14px"></div>
  </div>

  <div id="view-stats" style="display:none">
    <div class="chip-row" id="statYearChips" style="margin-bottom:14px"></div>
    <div class="stat-cards" id="statCards"></div>
    <div class="flex2">
      <div class="panel">
        <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z" stroke-linejoin="round"/></svg>花费分类占比</h3>
        <div id="catChart"></div>
        <div class="legend" id="catLegend"></div>
      </div>
      <div class="panel">
        <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 9l-5 5-3-3-3 3"/></svg>逐年花费趋势</h3>
        <div id="trendChart"></div>
      </div>
    </div>
    <div class="panel">
      <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M3 12h18M3 6h18M3 18h18"/></svg>各年明细</h3>
      <div id="yearTable"></div>
    </div>
  </div>
</div>

<!-- add/edit form -->
<div class="mask" id="formMask">
  <div class="sheet">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span id="formTitle">新增路线</span><button class="close-x" data-close="formMask">×</button></h2>
    <div class="field"><label>路线名称 <span class="hint">如：西北大环线 / 京都赏枫</span></label><input id="f_name" placeholder="路线名称"></div>
    <div class="exp-grid">
      <div class="field"><label>年份</label><input id="f_year" placeholder="2026" inputmode="numeric"></div>
      <div class="field"><label>出行日期</label><input id="f_daterange" placeholder="6/17 - 6/24"></div>
      <div class="field"><label>类型</label>
        <select id="f_type"><option value="自由行">自由行</option><option value="跟团">跟团</option><option value="半自由行">半自由行</option></select>
      </div>
      <div class="field"><label>天数</label><input id="f_days" placeholder="8" inputmode="numeric"></div>
      <div class="field"><label>同行人数 <span class="hint">用于算人均</span></label><input id="f_people" placeholder="2" inputmode="numeric"></div>
      <div class="field"><label>主要目的地</label><input id="f_dest" placeholder="青海、甘肃"></div>
    </div>
    <div class="field"><label>景点路线</label><textarea id="f_scenic" placeholder="按天记录：Day1 西宁-祁连…；Day2 张掖…"></textarea></div>
    <div class="field"><label>住宿位置</label><textarea id="f_hotel" placeholder="如家武林广场店、迪堡酒店…"></textarea></div>
    <div class="field">
      <label>9 类花费（元）<span class="hint">只填知道的，留空计 0</span></label>
      <div class="exp-grid" id="expInputs"></div>
    </div>
    <div class="field"><label>备注</label><textarea id="f_notes" placeholder="可选"></textarea></div>
    <div class="sheet-actions">
      <button class="btn btn-danger btn-sm" id="formDelete" style="display:none">删除</button>
      <button class="btn" data-close="formMask">取消</button>
      <button class="btn btn-primary" id="formSave">保存路线</button>
    </div>
  </div>
</div>

<!-- detail -->
<div class="mask" id="detailMask">
  <div class="sheet">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span id="d_name"></span><button class="close-x" data-close="detailMask">×</button></h2>
    <div id="d_body"></div>
    <div class="sheet-actions">
      <button class="btn" id="d_edit">编辑</button>
      <button class="btn btn-primary" data-close="detailMask">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="foot">© Kyson · 本演示数据仅保存在你的浏览器本地（localStorage），刷新或重开浏览器仍在，清除浏览器数据即丢失，不会上传任何服务器。<br>完整自托管版（数据存你自己的服务器）见 <a href="https://github.com/hanyuestar/travel-expense" target="_blank" rel="noopener">GitHub 仓库</a>。</div>

<script>
const CATS=["交通","机票","高铁","住宿","餐饮","门票","团费","购物","其他"];
const COLORS={"交通":"#60a5fa","机票":"#3b82f6","高铁":"#06b6d4","住宿":"#f59e0b","餐饮":"#ef6b5e","门票":"#a78bfa","团费":"#ec4899","购物":"#fb923c","其他":"#94a3b8"};
const LS_KEY="travel_expense_demo_v1";
const SAMPLE=[
  {id:"sample001",year:"2024",name:"示例·东海海岛慢游",daterange:"7/12 - 7/16",type:"自由行",days:5,people:2,dest:"东海群岛",
   scenic:"Day1 抵达海岛-入住民宿-海边日落\nDay2 浮潜-环岛骑行\nDay3 渔村早市-灯塔徒步\nDay4 出海观鲸-温泉\nDay5 返程",hotel:"海岛民宿",
   exp:{"交通":0,"机票":2400,"高铁":0,"住宿":1200,"餐饮":800,"门票":300,"团费":0,"购物":500,"其他":200},notes:"示例数据，仅用于演示"},
  {id:"sample002",year:"2025",name:"示例·江南水乡漫步",daterange:"4/03 - 4/05",type:"半自由行",days:3,people:2,dest:"江南古镇",
   scenic:"Day1 抵达-乌篷船-老街\nDay2 园林-博物馆\nDay3 早茶-返程",hotel:"临水客栈",
   exp:{"交通":0,"机票":0,"高铁":600,"住宿":900,"餐饮":450,"门票":260,"团费":0,"购物":380,"其他":110},notes:"示例数据，仅用于演示"},
  {id:"sample003",year:"2023",name:"示例·西北高原徒步",daterange:"9/28 - 10/02",type:"跟团",days:5,people:4,dest:"西北高原",
   scenic:"Day1 集合-草原\nDay2 雪山徒步\nDay3 湖泊-骑行\nDay4 峡谷\nDay5 返程",hotel:"营地 / 客栈",
   exp:{"交通":0,"机票":3200,"高铁":0,"住宿":1500,"餐饮":1000,"门票":600,"团费":2000,"购物":0,"其他":400},notes:"示例数据，仅用于演示"},
  {id:"sample004",year:"2026",name:"示例·周末近郊轻旅行",daterange:"10/02 - 10/03",type:"自由行",days:2,people:3,dest:"近郊度假区",
   scenic:"Day1 自驾-露营-烧烤\nDay2 徒步-返程",hotel:"营地",
   exp:{"交通":200,"机票":0,"高铁":0,"住宿":0,"餐饮":350,"门票":120,"团费":0,"购物":0,"其他":80},notes:"示例数据，仅用于演示"}
];
let routes=[];
let state={view:"routes",filterYear:"all",search:"",curId:null};

/* ---------- 浏览器本地存储（替代后端 API） ---------- */
function load(){
  try{const s=localStorage.getItem(LS_KEY);if(s){const a=JSON.parse(s);if(Array.isArray(a)&&a.length)return a;}}catch(e){}
  const seed=SAMPLE.map(r=>Object.assign({},r));localStorage.setItem(LS_KEY,JSON.stringify(seed));return seed;
}
function persist(){try{localStorage.setItem(LS_KEY,JSON.stringify(routes));}catch(e){}}
function setSync(t){const el=document.getElementById("syncTxt");if(el)el.textContent=t;}
function uid(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
async function apiGet(){return routes;}
async function apiPost(obj){const rec=Object.assign({id:uid()},obj);routes.unshift(rec);persist();return rec;}
async function apiPut(id,obj){const i=routes.findIndex(r=>r.id===id);if(i<0)return null;routes[i]=Object.assign({},routes[i],obj,{id});persist();return routes[i];}
async function apiDelete(id){routes=routes.filter(r=>r.id!==id);persist();}
async function apiDeleteAll(){routes=[];persist();}
async function reload(){routes=load();refresh();}

function fmt(n){n=Math.round((n||0)*100)/100;return n.toLocaleString("zh-CN");}
function totalOf(r){return CATS.reduce((s,c)=>s+(parseFloat(r.exp[c])||0),0);}
function perOf(r){const t=totalOf(r);const p=parseFloat(r.people)||0;return p>0?Math.round(t/p):null;}

function parseStart(dr,year){
  if(!dr)return null;
  let m=dr.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(m){return new Date(+m[1],+m[2]-1,+m[3]);}
  m=dr.match(/(\d{1,2})[\/\-.](\d{1,2})/);
  if(m&&year){return new Date(+year,+m[1]-1,+m[2]);}
  return null;
}
function isUpcoming(r){const d=parseStart(r.daterange,r.year);if(!d)return false;const t=new Date();t.setHours(0,0,0,0);return d>=t;}

function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1800);}

/* ---------- render routes ---------- */
function years(){return [...new Set(routes.map(r=>r.year))].filter(Boolean).sort((a,b)=>b-a);}
function renderYears(){
  const ys=years();const box=document.getElementById("yearChips");
  let h='<div class="chip'+(state.filterYear==="all"?" active":"")+'" data-y="all">全部</div>';
  ys.forEach(y=>h+='<div class="chip'+(state.filterYear===y?" active":"")+'" data-y="'+y+'">'+y+'</div>');
  box.innerHTML=h;
}
function miniBar(r){
  const t=totalOf(r);if(t<=0)return '<div class="minibar"></div>';
  let s='<div class="minibar">';
  CATS.forEach(c=>{const v=parseFloat(r.exp[c])||0;if(v>0){const pct=(v/t*100).toFixed(1);s+='<span style="width:'+pct+'%;background:'+COLORS[c]+'" title="'+c+' '+fmt(v)+'"></span>';}});
  return s+'</div>';
}
function renderRoutes(){
  renderYears();
  const grid=document.getElementById("routeGrid");
  let list=routes.filter(r=>state.filterYear==="all"||r.year===state.filterYear);
  const q=state.search.trim().toLowerCase();
  if(q)list=list.filter(r=>(r.name+" "+(r.dest||"")+" "+(r.scenic||"")).toLowerCase().includes(q));
  list.sort((a,b)=>{const da=parseStart(a.daterange,a.year),db=parseStart(b.daterange,b.year);return (db?db.getTime():0)-(da?da.getTime():0);});
  if(!list.length){grid.innerHTML='<div class="empty">暂无路线，点右上角「新增路线」开始记录吧 ✈</div>';return;}
  grid.innerHTML=list.map(r=>{
    const t=totalOf(r);const per=perOf(r);
    return '<div class="card">'+
      '<div class="card-top"><div><div class="card-name">'+esc(r.name)+'</div>'+
      '<div class="badges"><span class="badge b-year">'+esc(r.year||"")+'</span>'+
      '<span class="badge b-type">'+esc(r.type||"")+'</span>'+
      (r.days?'<span class="badge b-days">'+r.days+'天</span>':'')+'</div></div></div>'+
      '<div class="card-meta">📅 '+esc(r.daterange||"")+(r.dest?' · '+esc(r.dest):'')+'</div>'+
      '<div class="card-total"><span class="amt">¥'+fmt(t)+'</span>'+(per!=null?'<span class="per">人均 ¥'+fmt(per)+'</span>':'')+'</div>'+
      miniBar(r)+
      '<div class="card-actions"><button class="btn btn-sm" data-act="detail" data-id="'+r.id+'">查看</button>'+
      '<button class="btn btn-sm" data-act="edit" data-id="'+r.id+'">编辑</button></div>'+
    '</div>';
  }).join("");
}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ---------- upcoming ---------- */
function renderUpcoming(){
  const box=document.getElementById("upcomingBox");const list=document.getElementById("upList");
  const up=routes.filter(isUpcoming);
  if(!up.length){box.style.display="none";return;}
  box.style.display="block";
  list.innerHTML=up.map(r=>'<div class="up-card" data-act="detail" data-id="'+r.id+'">'+
    '<div class="up-name">'+esc(r.name)+'</div>'+
    '<div class="up-meta">📅 '+esc(r.daterange||"")+(r.days?' · '+r.days+'天':'')+'</div>'+
    '<span class="up-tag">即将出行</span></div>').join("");
}

/* ---------- stats ---------- */
function renderStatYears(){
  const ys=years();const box=document.getElementById("statYearChips");
  let h='<div class="chip'+(state.filterYear==="all"?" active":"")+'" data-sy="all">全部年份</div>';
  ys.forEach(y=>h+='<div class="chip'+(state.filterYear===y?" active":"")+'" data-sy="'+y+'">'+y+'</div>');
  box.innerHTML=h;
}
function renderStats(){
  renderStatYears();
  const scope=routes.filter(r=>state.filterYear==="all"||r.year===state.filterYear);
  const total=scope.reduce((s,r)=>s+totalOf(r),0);
  const count=scope.length;
  const days=scope.reduce((s,r)=>s+(parseInt(r.days)||0),0);
  const avg=count?Math.round(total/count):0;
  document.getElementById("statCards").innerHTML=
    card("总花费",addYen(total))+card("出行次数",count+" 次")+
    card("次均花费",addYen(avg))+card("总天数",days+" 天");
  const catTot={};CATS.forEach(c=>catTot[c]=0);
  scope.forEach(r=>CATS.forEach(c=>catTot[c]+=parseFloat(r.exp[c])||0));
  const data=CATS.filter(c=>catTot[c]>0).map(c=>({label:c,value:catTot[c],color:COLORS[c]}));
  document.getElementById("catChart").innerHTML=donut(data);
  document.getElementById("catLegend").innerHTML=data.map(d=>{
    const pct=total>0?Math.round(d.value/total*100):0;
    return '<div class="legend-item"><span class="sw" style="background:'+d.color+'"></span>'+
      '<span>'+d.label+'</span><span class="lp">'+pct+'%</span><span class="lv">¥'+fmt(d.value)+'</span></div>';
  }).join("")||'<div class="empty">暂无花费数据</div>';
  const ys=years();
  document.getElementById("trendChart").innerHTML=trend(ys);
  document.getElementById("yearTable").innerHTML=yearTable(ys);
}
function card(v,l){return '<div class="stat"><div class="v">'+l+'</div><div class="l">'+v+'</div></div>';}
function addYen(n){return "¥"+fmt(n);}
function donut(data){
  const total=data.reduce((s,d)=>s+d.value,0);
  if(total<=0)return '<div class="empty">暂无花费数据</div>';
  const r=70,cx=90,cy=90,sw=30,C=2*Math.PI*r;let off=0,segs="";
  data.forEach(d=>{const len=d.value/total*C;segs+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+d.color+'" stroke-width="'+sw+'" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';off+=len;});
  return '<svg viewBox="0 0 180 180" class="chart">'+segs+
    '<text x="90" y="86" text-anchor="middle" class="donut-total">¥'+fmt(total)+'</text>'+
    '<text x="90" y="106" text-anchor="middle" class="donut-sub">总花费</text></svg>';
}
function trend(ys){
  if(!ys.length)return '<div class="empty">暂无数据</div>';
  const vals=ys.map(y=>routes.filter(r=>r.year===y).reduce((s,r)=>s+totalOf(r),0));
  const max=Math.max(...vals,1);const W=520,H=200,pad=30,bw=Math.min(70,(W-pad*2)/ys.length-14);
  const gap=(W-pad*2-ys.length*bw)/(ys.length+1);
  let s='<svg viewBox="0 0 '+W+' '+H+'" class="chart" style="max-width:100%">';
  s+='<line x1="'+pad+'" y1="'+(H-30)+'" x2="'+(W-pad)+'" y2="'+(H-30)+'" stroke="#e3efeb"/>';
  ys.forEach((y,i)=>{const v=vals[i];const h=v/max*(H-60);const x=pad+gap+i*(bw+gap);const y0=(H-30)-h;
    s+='<rect x="'+x+'" y="'+y0+'" width="'+bw+'" height="'+h+'" rx="6" fill="'+COLORS.机票+'" opacity="'+(0.55+0.45*(v/max))+'"><title>'+y+'：¥'+fmt(v)+'</title></rect>';
    s+='<text x="'+(x+bw/2)+'" y="'+(y0-6)+'" text-anchor="middle" font-size="12" fill="#1f2d2b" font-weight="700">¥'+fmt(v)+'</text>';
    s+='<text x="'+(x+bw/2)+'" y="'+(H-10)+'" text-anchor="middle" font-size="12" fill="#6b7d79">'+y+'</text>';
  });
  return s+'</svg>';
}
function yearTable(ys){
  if(!ys.length)return '<div class="empty">暂无数据</div>';
  let h='';
  ys.forEach(y=>{const rs=routes.filter(r=>r.year===y);const tot=rs.reduce((s,r)=>s+totalOf(r),0);const dy=rs.reduce((s,r)=>s+(parseInt(r.days)||0),0);
    h+='<div class="detail-row"><span class="k">'+y+' 年（'+rs.length+' 次 / '+dy+' 天）</span><span class="v">¥'+fmt(tot)+'</span></div>';
  });
  return h;
}

/* ---------- form ---------- */
function buildExpInputs(){
  document.getElementById("expInputs").innerHTML=CATS.map(c=>
    '<div class="exp-cell"><div class="el"><span class="sw" style="background:'+COLORS[c]+'"></span>'+c+'</div>'+
    '<input type="number" min="0" step="0.01" id="exp_'+c+'" placeholder="0"></div>').join("");
}
function openForm(id){
  state.curId=id||null;
  document.getElementById("formDelete").style.display=id?"inline-flex":"none";
  document.getElementById("formTitle").textContent=id?"编辑路线":"新增路线";
  const r=id?routes.find(x=>x.id===id):null;
  document.getElementById("f_name").value=r?r.name:"";
  document.getElementById("f_year").value=r?r.year:new Date().getFullYear();
  document.getElementById("f_daterange").value=r?r.daterange:"";
  document.getElementById("f_type").value=r?(r.type||"自由行"):"自由行";
  document.getElementById("f_days").value=r?r.days:"";
  document.getElementById("f_people").value=r?r.people:"2";
  document.getElementById("f_dest").value=r?(r.dest||""):"";
  document.getElementById("f_scenic").value=r?(r.scenic||""):"";
  document.getElementById("f_hotel").value=r?(r.hotel||""):"";
  document.getElementById("f_notes").value=r?(r.notes||""):"";
  CATS.forEach(c=>document.getElementById("exp_"+c).value=r?(r.exp&&r.exp[c]!=null?r.exp[c]:""):"");
  openMask("formMask");
}
async function saveForm(){
  const name=document.getElementById("f_name").value.trim();
  if(!name){toast("请填写路线名称");return;}
  const exp={};CATS.forEach(c=>exp[c]=parseFloat(document.getElementById("exp_"+c).value)||0);
  const obj={name:name,year:document.getElementById("f_year").value.trim(),daterange:document.getElementById("f_daterange").value.trim(),
    type:document.getElementById("f_type").value,days:parseInt(document.getElementById("f_days").value)||0,
    people:parseInt(document.getElementById("f_people").value)||0,dest:document.getElementById("f_dest").value.trim(),
    scenic:document.getElementById("f_scenic").value,hotel:document.getElementById("f_hotel").value,
    notes:document.getElementById("f_notes").value,exp:exp};
  setSync("保存中…");
  try{
    if(state.curId){await apiPut(state.curId,obj);toast("已保存");}
    else{await apiPost(obj);toast("已新增路线");}
    closeMask("formMask");await reload();setSync("已存浏览器本地");
  }catch(e){toast("保存失败，请重试");setSync("已存浏览器本地");}
}
async function deleteRoute(id){
  if(!confirm("确定删除这条路线？此操作不可撤销"))return;
  try{await apiDelete(id);await reload();toast("已删除");setSync("已存浏览器本地");}
  catch(e){toast("删除失败，请重试");}
}

/* ---------- detail ---------- */
function openDetail(id){
  const r=routes.find(x=>x.id===id);if(!r)return;state.curId=id;
  document.getElementById("d_name").textContent=r.name;
  const t=totalOf(r);const per=perOf(r);
  let h='';
  h+=row("年份 / 类型",(r.year||"")+" · "+(r.type||""));
  h+=row("出行日期",(r.daterange||"")+(r.days?"（"+r.days+"天）":""));
  h+=row("目的地",r.dest||"—");
  h+=row("住宿",r.hotel||"—");
  h+=row("总花费",addYen(t)+(per!=null?"（人均 "+addYen(per)+"）":""));
  h+='<div class="detail-row"><span class="k">景点路线</span></div><div class="pre-wrap">'+(r.scenic?esc(r.scenic):"—")+'</div>';
  h+='<div style="height:10px"></div><div class="detail-row"><span class="k">9 类花费明细</span><span class="v">合计 '+addYen(t)+'</span></div>';
  CATS.forEach(c=>{const v=parseFloat(r.exp[c])||0;h+=detailExp(c,v,t);});
  if(r.notes)h+='<div style="height:10px"></div><div class="detail-row"><span class="k">备注</span></div><div class="pre-wrap">'+esc(r.notes)+'</div>';
  document.getElementById("d_body").innerHTML=h;
  openMask("detailMask");
}
function row(k,v){return '<div class="detail-row"><span class="k">'+k+'</span><span class="v">'+esc(v)+'</span></div>';}
function detailExp(c,v,t){const pct=t>0?Math.round(v/t*100):0;
  return '<div class="detail-row"><span class="k"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+COLORS[c]+';margin-right:6px"></span>'+c+'</span>'+
    '<span class="v">¥'+fmt(v)+' <span style="color:var(--muted);font-weight:400;font-size:12px">'+pct+'%</span></span></div>';}

/* ---------- backup（演示：仅操作浏览器本地） ---------- */
function exportData(){
  const blob=new Blob([JSON.stringify(routes,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="旅行经费台_演示备份_"+new Date().toISOString().slice(0,10)+".json";a.click();
  toast("已导出 JSON 备份");
}
async function importData(file){
  let arr;
  try{arr=JSON.parse(await file.text());}catch(e){toast("导入失败：文件格式不正确");return;}
  if(!Array.isArray(arr)){toast("导入失败：应为路线数组");return;}
  const existing=new Set(routes.map(r=>r.id));
  let added=0;
  for(const r of arr){
    if(!r.id)r.id="r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    if(existing.has(r.id))continue;
    await apiPost(r);added++;
  }
  await reload();toast("已导入 "+added+" 条路线");setSync("已存浏览器本地");
}
async function clearAll(){
  if(!confirm("⚠ 将清空全部演示数据（仅清除你浏览器本地存储），且无法恢复！继续？"))return;
  await apiDeleteAll();await reload();toast("已清空全部数据");setSync("已存浏览器本地");
}

/* ---------- helpers ---------- */
function openMask(id){document.getElementById(id).classList.add("open");}
function closeMask(id){document.getElementById(id).classList.remove("open");}
function refresh(){renderUpcoming();renderRoutes();renderStats();}

/* ---------- events ---------- */
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");
  state.view=t.dataset.view;
  document.getElementById("view-routes").style.display=state.view==="routes"?"block":"none";
  document.getElementById("view-stats").style.display=state.view==="stats"?"block":"none";
  if(state.view==="stats")renderStats();
});
document.getElementById("yearChips").onclick=e=>{const c=e.target.closest("[data-y]");if(c){state.filterYear=c.dataset.y;renderRoutes();}};
document.getElementById("statYearChips").onclick=e=>{const c=e.target.closest("[data-sy]");if(c){state.filterYear=c.dataset.sy;renderStats();}};
document.getElementById("search").oninput=e=>{state.search=e.target.value;renderRoutes();};
document.getElementById("routeGrid").onclick=e=>{const b=e.target.closest("[data-act]");if(!b)return;const id=b.dataset.id;
  if(b.dataset.act==="detail")openDetail(id);else if(b.dataset.act==="edit")openForm(id);};
document.getElementById("upList").onclick=e=>{const b=e.target.closest("[data-act]");if(b)openDetail(b.dataset.id);};
document.getElementById("addBtn").onclick=()=>openForm(null);
document.getElementById("formSave").onclick=saveForm;
document.getElementById("formDelete").onclick=()=>deleteRoute(state.curId);
document.getElementById("d_edit").onclick=()=>{closeMask("detailMask");openForm(state.curId);};
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>closeMask(b.dataset.close));
document.querySelectorAll(".mask").forEach(m=>m.onclick=e=>{if(e.target===m)closeMask(m.id);});
document.getElementById("backupBtn").onclick=()=>document.getElementById("backupMenu").classList.toggle("open");
document.getElementById("expBtn").onclick=()=>{exportData();document.getElementById("backupMenu").classList.remove("open");};
document.getElementById("impBtn").onclick=()=>{document.getElementById("fileInput").click();document.getElementById("backupMenu").classList.remove("open");};
document.getElementById("clrAllBtn").onclick=()=>{clearAll();document.getElementById("backupMenu").classList.remove("open");};
document.getElementById("fileInput").onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value="";};
document.addEventListener("click",e=>{if(!e.target.closest(".menu"))document.getElementById("backupMenu").classList.remove("open");});

/* ---------- init ---------- */
buildExpInputs();
(async ()=>{
  setSync("加载中…");
  try{routes=load();setSync("演示·数据在浏览器");refresh();}
  catch(e){setSync("加载失败");toast("本地存储不可用，请换用现代浏览器");routes=[];refresh();}
})();
</script>
