name: Build Android APK

# 手动触发：构建旅行经费工作台安卓 APK 并发布到指定 Release（默认 v1.1.0）。
# 内置服务器地址来自加密 Secret TE_SERVER_URL（个人域名不进入仓库源码/日志）。
# 注意：本流程只替换 Release 上的 app-debug.apk 资产，不动 git tag。
# 前置：目标 Release 必须已存在。本仓库没有自动创建 Release 的工作流，
#       发版时需先为 tag 建 Release，再手动触发本流程上传 APK。
on:
  workflow_dispatch:
    inputs:
      apk_asset_tag:
        description: '目标 Release tag（APK 将作为该 Release 的 app-debug.apk 资产）'
        required: false
        default: 'v1.1.0'

permissions:
  contents: write   # 用于 gh release upload 覆盖资产

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TE_SERVER_URL: ${{ secrets.TE_SERVER_URL }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 必须显式覆盖默认值。该 action 默认 packages 为 "tools platform-tools"，
          # 但旧版 `tools` 包已被 Google 从 SDK 仓库下线，sdkmanager 会报
          # "Failed to find package 'tools'" 并以退出码 1 中断整个任务。
          packages: 'platform-tools'

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install deps, sync assets, build APK
        working-directory: android-app
        run: |
          npm install
          npx cap add android || true
          npm run sync
          cd android
          chmod +x ./gradlew || true
          ./gradlew assembleDebug

      - name: Verify APK produced
        run: ls -la android-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.apk_asset_tag }}" \
            android-app/android/app/build/outputs/apk/debug/app-debug.apk \
            --clobber --repo hanyuestar/travel-expense
