name: Publish Docker image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像标签（默认 v1.0.5；免动 git tag 时用于重建同名镜像）'
        required: false
        default: 'v1.0.5'

jobs:
  push:
    name: Push single image (GHCR always, Docker Hub optional)
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    env:
      # secrets 不能在 job 级 if 直接用，先注入 env，步骤级 if 判断
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Decide image tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          {
            echo "list<<EOF"
            echo "type=raw,value=${TAG}"
            echo "type=raw,value=latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Save version info
        run: |
          git describe --tags > VERSION 2>/dev/null || echo "0.0.0-dev" > VERSION

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (optional)
        if: ${{ env.DH_USER != '' && env.DH_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DH_USER }}
          password: ${{ env.DH_TOKEN }}

      # --- GHCR：必推 ---
      - name: Extract metadata for GHCR
        id: meta_ghcr
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: ${{ steps.tags.outputs.list }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_ghcr.outputs.tags }}
          labels: ${{ steps.meta_ghcr.outputs.labels }}

      # --- Docker Hub：可选（未配置 Secrets 时自动跳过） ---
      - name: Extract metadata for Docker Hub
        id: meta_dh
        if: ${{ env.DH_USER != '' && env.DH_TOKEN != '' }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DH_USER }}/travel-expense
          tags: ${{ steps.tags.outputs.list }}

      - name: Build and push to Docker Hub
        if: ${{ env.DH_USER != '' && env.DH_TOKEN != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_dh.outputs.tags }}
          labels: ${{ steps.meta_dh.outputs.labels }}
