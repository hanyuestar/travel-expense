name: Publish Docker images

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  push_to_registries:
    name: Push Docker images to registries
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component:
          - { name: frontend, file: Dockerfile.frontend }
          - { name: backend,  file: Dockerfile.backend }
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Save version info
        run: |
          git describe --tags > VERSION 2>/dev/null || echo "0.0.0-dev" > VERSION

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/travel-expense-${{ matrix.component.name }}
            ghcr.io/${{ github.repository }}-${{ matrix.component.name }}
          flavor: |
            latest=true

      - name: Build and push Docker image (${{ matrix.component.name }})
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ${{ matrix.component.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
